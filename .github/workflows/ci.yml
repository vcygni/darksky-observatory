name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no major tags since v8
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check apps/stargazing_spots scripts notebooks
      - run: uv run ruff format --check apps/stargazing_spots scripts notebooks
      - run: uv run mypy
      - run: uv run pytest
