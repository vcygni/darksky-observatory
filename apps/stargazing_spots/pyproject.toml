[project]
name = "stargazing-spots"
version = "0.7.0"
description = "Ranked stargazing spots in Portugal from VIIRS night lights, terrain and cloud climatology"
readme = { text = "See the repository README.", content-type = "text/plain" }
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "AstroTraveler" }]
keywords = ["earth-observation", "viirs", "night-lights", "dark-sky", "geospatial", "stac"]
dependencies = [
    "aiohttp>=3.9",
    "blackmarblepy>=2026.6.1",
    "dask>=2024.1",
    "fsspec>=2024.6",
    "geopandas>=1.0",
    "joblib>=1.4",
    "netcdf4>=1.6",
    "numpy>=2.0",
    "osmium>=4.0",
    "pyarrow>=14.0",
    "pystac>=1.10",
    "python-dotenv>=1.0",
    "rasterio>=1.4",
    "scipy>=1.12",
    "shapely>=2.0",
    "xarray>=2026.9", # reads zarr v3 metadata (Earth Data Hub)
    "zarr>=3.0",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=6.29", "matplotlib>=3.8", "nbconvert>=7.16"]
test = ["pytest>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stargazing_spots"]
